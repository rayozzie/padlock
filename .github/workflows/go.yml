name: Go checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'

permissions:
  contents: read

env:
  # Check the exact minimum from go.mod; do not silently switch toolchains.
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build-and-scan:
    name: Build and scan (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Install for the runner before setting the cross-compilation target.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Build and check reachable vulnerabilities
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          go build -o "$RUNNER_TEMP/padlock" ./cmd/padlock
          govulncheck ./...
