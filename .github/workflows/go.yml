name: Go checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'

permissions:
  contents: read

env:
  # Check the exact minimum from go.mod; do not silently switch toolchains.
  GOTOOLCHAIN: local

jobs:
  windows-package:
    name: Run published Windows binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      PADLOCK_BINARY: bin/windows-${{ matrix.arch }}/padlock.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check checksum and restore BIN/PNG backups
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = (Resolve-Path $env:PADLOCK_BINARY).Path
          $expected = (Get-Content "$binary.sha256.txt").Split()[0]
          if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne $expected) {
            throw 'Published executable checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $inputDir = Join-Path $root 'input'
          try {
            [System.IO.Directory]::CreateDirectory((Join-Path $inputDir 'empty')) | Out-Null
            $payload = [byte[]]::new(14003)
            [System.Random]::new(41).NextBytes($payload)
            $source = Join-Path $inputDir 'source.bin'
            [System.IO.File]::WriteAllBytes($source, $payload)
            foreach ($format in @('bin', 'png')) {
              $backup = Join-Path $root "backup-$format"
              $restore = Join-Path $root "restore-$format"
              & $binary encode $inputDir $backup -copies 3 -required 2 -format $format -chunk 1024
              if ($LASTEXITCODE -ne 0) { throw "Encoding $format failed" }
              Remove-Item -LiteralPath (Join-Path $backup '2B3.tar')
              & $binary decode $backup $restore -dryrun
              if ($LASTEXITCODE -ne 0) { throw "Validating $format failed" }
              if (Test-Path -LiteralPath $restore) { throw 'Dry run created output' }
              & $binary decode $backup $restore
              if ($LASTEXITCODE -ne 0) { throw "Restoring $format failed" }
              $restored = Join-Path $restore 'source.bin'
              if ((Get-FileHash $source).Hash -ne (Get-FileHash $restored).Hash) {
                throw "Restored $format bytes differ"
              }
              if (-not (Test-Path (Join-Path $restore 'empty') -PathType Container)) {
                throw 'Empty directory was lost'
              }
            }
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build-and-scan:
    name: Build and scan (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Install for the runner before setting the cross-compilation target.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Build and check reachable vulnerabilities
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          go build -o "$RUNNER_TEMP/padlock" ./cmd/padlock
          govulncheck ./...
